[package]
name = "rfb-tls"
description = "TLS 1.3 for Aurora VNC (rustls): VeNCrypt transport upgrade, sans-I/O and blocking wrappers, certificate helpers."
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
rust-version = "1.85"

[features]
default = []
# Trust the operating system's CA store (ServerVerification::SystemRoots).
system-roots = ["dep:rustls-native-certs"]

[dependencies]
rfb-proto = { path = "../rfb-proto", version = "0.1.0" }
# TLS 1.3 only: the `tls12` feature is deliberately left off, so TLS 1.2 code is
# not even compiled in. `ring` is the crypto provider (portable, no cmake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls-native-certs = { version = "0.8", optional = true }