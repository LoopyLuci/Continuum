apiVersion: v1
kind: Namespace
metadata:
  name: continuum
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuum-server
  namespace: continuum
  labels:
    app: continuum-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: continuum-server
  template:
    metadata:
      labels:
        app: continuum-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/health/prometheus"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: server
        image: continuum-server:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--listen=0.0.0.0:4433"
          - "--quality=85"
          - "--fps=30"
        ports:
        - containerPort: 4433
          protocol: UDP
          name: quic
        - containerPort: 9091
          protocol: TCP
          name: health
        env:
        - name: CONTINUUM_PAIRING_CODE
          valueFrom:
            secretKeyRef:
              name: continuum-secrets
              key: pairing-code
        - name: RUST_LOG
          value: "info"
        - name: RUST_BACKTRACE
          value: "1"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9091
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9091
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/continuum
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuum-relay
  namespace: continuum
  labels:
    app: continuum-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: continuum-relay
  template:
    metadata:
      labels:
        app: continuum-relay
    spec:
      containers:
      - name: relay
        image: relay-server:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--listen=0.0.0.0:4434"
        ports:
        - containerPort: 4434
          protocol: UDP
          name: quic-relay
        resources:
          requests:
            memory: "32Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Secret
metadata:
  name: continuum-secrets
  namespace: continuum
type: Opaque
stringData:
  pairing-code: "change-this-in-production"
---
apiVersion: v1
kind: Service
metadata:
  name: continuum-server
  namespace: continuum
  labels:
    app: continuum-server
spec:
  selector:
    app: continuum-server
  ports:
  - port: 4433
    targetPort: 4433
    protocol: UDP
    name: quic
  - port: 9091
    targetPort: 9091
    protocol: TCP
    name: health
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: continuum-relay
  namespace: continuum
  labels:
    app: continuum-relay
spec:
  selector:
    app: continuum-relay
  ports:
  - port: 4434
    targetPort: 4434
    protocol: UDP
    name: quic-relay
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: continuum-server
  namespace: continuum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: continuum-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: continuum-relay
  namespace: continuum
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: continuum-relay
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: continuum-network-policy
  namespace: continuum
spec:
  podSelector:
    matchLabels:
      app: continuum-server
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: continuum
    ports:
    - port: 4433
      protocol: UDP
  policyTypes:
  - Ingress
