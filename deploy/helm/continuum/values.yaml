# Default values for continuum Helm chart
replicaCount: 1

image:
  repository: continuum-server
  tag: latest
  pullPolicy: IfNotPresent

config:
  listenAddr: "0.0.0.0:4433"
  quality: 85
  fps: 30
  pairingCode: "change-this-in-production"
  logLevel: "info"

relay:
  enabled: true
  replicas: 2
  listenAddr: "0.0.0.0:4434"

resources:
  server:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "1000m"
  relay:
    requests:
      memory: "32Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "500m"

health:
  port: 9091

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  healthPort: 9091

relayService:
  type: LoadBalancer
