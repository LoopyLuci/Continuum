apiVersion: v1
kind: Namespace
metadata:
  name: continuum
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuum-server
  namespace: continuum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: continuum-server
  template:
    metadata:
      labels:
        app: continuum-server
    spec:
      containers:
      - name: server
        image: continuum-server:latest
        args: ["--listen=0.0.0.0:4433"]
        ports:
        - containerPort: 4433
          protocol: UDP
        env:
        - name: CONTINUUM_PAIRING_CODE
          value: "continuum"
        - name: RUST_LOG
          value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: continuum-server
  namespace: continuum
spec:
  selector:
    app: continuum-server
  ports:
  - port: 4433
    targetPort: 4433
    protocol: UDP
  type: ClusterIP
