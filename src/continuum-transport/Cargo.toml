[package]
name = "continuum-transport"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tracing.workspace = true

quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
screenshots = "0.8"
enigo = "0.2"
image = { version = "0.25", features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
parking_lot = "0.12"
bytes = "1"
flume = "0.11"
hostname = "0.4"
continuum-security = { path = "../continuum-security" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
wasmtime = { version = "25", optional = true }
continuum-observability = { path = "../continuum-observability" }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
thiserror.workspace = true
zeroize = "1"
subtle = "2"
scrap = { version = "0.5", optional = true }
core-graphics = { version = "0.25", optional = true }
libxdo = { version = "0.6", optional = true }

[features]
default = ["platform-windows"]
platform-windows = []
platform-macos = ["scrap", "core-graphics"]
platform-linux = ["scrap", "libxdo"]
nvenc = []
vaapi = []
wasm-plugins = ["wasmtime"]
observability = []
