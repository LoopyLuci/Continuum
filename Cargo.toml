[workspace]
members = [
  "src/continuum-core",
  "src/continuum-transport",
  "src/continuum-server",
  "src/continuum-client",
  "src/continuum",
  "src/continuum-test",
  "src/continuum-observability",
  "src/continuum-security",
  "src/relay-server",
  "src/continuum-ci", "src/continuum-ice", "src/continuum-discovery", "src/continuum-codec", "src/continuum-session", "src/continuum-performance", "src/continuum-testing", "src/continuum-ui", "src/continuum-web", "src/continuum-mobile", "src/continuum-enterprise", "src/continuum-plugins",
]
default-members = [
  "src/continuum-transport",
  "src/continuum-server",
  "src/continuum-client",
  "src/continuum",
  "src/continuum-test",
  "src/continuum-observability",
  "src/continuum-security",
  "src/relay-server",
  "src/continuum-ci",
]
exclude = ["src/continuum-ai", "src/continuum-plugin-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/loopyluci/Continuum"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
image = { version = "0.25", features = ["jpeg", "png"] }
thiserror = "2"

# aurora-vnc integration (portable crates only)
rfb-proto = { path = "C:/Projects/aurora-vnc-main/crates/rfb-proto", version = "0.1.0" }
rfb-tls = { path = "C:/Projects/aurora-vnc-main/crates/rfb-tls", version = "0.1.0" }
vnc-client = { path = "C:/Projects/aurora-vnc-main/crates/vnc-client", version = "0.1.0" }
# vnc-host and gpu-ffi are Linux-only, disabled on Windows
# vnc-host = { path = "C:/Projects/aurora-vnc-main/crates/vnc-host", version = "0.1.0", features = ["x11", "video"], default-features = false }
# vnc-client = { path = "C:/Projects/aurora-vnc-main/crates/vnc-client", version = "0.1.0" }
# gpu-ffi = { path = "C:/Projects/aurora-vnc-main/crates/gpu-ffi", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
